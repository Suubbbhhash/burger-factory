# ============================================
# THE BURGER FACTORY — LOCAL DEV DOCKER COMPOSE
# Just PostgreSQL 16 + Redis 7 for local laptop dev
# Run: docker compose -f docker-compose.dev.yml up -d
# ============================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: burger
      POSTGRES_PASSWORD: factory_secret_2026
      POSTGRES_DB: burger_factory
    ports:
      - "5432:5432"
    volumes:
      - pgdevdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdevdata:
