# ============================================
# THE BURGER FACTORY — PRODUCTION DOCKER COMPOSE
# PostgreSQL 16 (btree_gist) + Redis 7 + API + Caddy
# ============================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-burger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-burger_factory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burger -d burger_factory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-burger}:${POSTGRES_PASSWORD:-factory_secret_2026}@db:5432/${POSTGRES_DB:-burger_factory}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-bf_super_secure_jwt_secret_key_2026_goa}
      COOKIE_SECRET: ${COOKIE_SECRET:-bf_cookie_signing_secret_key_32chars}
    ports:
      - "4000:4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
